version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: finarium-postgres
    environment:
      POSTGRES_DB: finarium
      POSTGRES_USER: finarium
      POSTGRES_PASSWORD: finarium
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finarium"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: finarium-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8090:8080"
    command: start-dev

  backend:
    build: ./backend
    container_name: finarium-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finarium
      SPRING_DATASOURCE_USERNAME: finarium
      SPRING_DATASOURCE_PASSWORD: finarium
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: finarium-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: