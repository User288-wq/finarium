spring:
  application:
    name: finarium-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/finarium
    username: finarium
    password: finarium
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
